architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // MixinExtras annotation processor: lets the Mixin AP refmap the @WrapOperation targets, which the
    // Forge production jar needs (SRG names at runtime). Fabric Loader bundles the runtime.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"))

    // TinyConfig from mavenLocal (published by the TinyConfig 1.20.1-modern port). The common module
    // compiles against the fabric flavour, same as the 1.21.1 line did with the Modrinth artifact.
    modImplementation "net.tiny_config:tiny_config-fabric:${rootProject.tiny_config_version}"
}
